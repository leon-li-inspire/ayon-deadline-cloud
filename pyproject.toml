# WARNING: This file is used only for development done on this addon.
# Be aware that dependencies used here might not match the ones used by
# the specific addon bundle set up on the AYON server. This file should
# be used only for local development and CI/CD purposes. To define addon
# dependencies, use pyproject.toml file in the `client` directory.

[project]
name = "ayon-deadline-cloud"
version = "0.0.1"
description = "AYON Integration with AWS Deadline Cloud"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "clique",
    "pre-commit",
    "ruff ~= 0.15.0",
    "ty",
    "pytest",
    "codespell",
    "pyblish-base>=1.8.12",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material >= 9.6.7",
    "mkdocs-autoapi >= 0.4.0",
    "mkdocstrings-python >= 1.16.2",
    "mkdocs-minify-plugin >= 0.8.0",
    "markdown-checklist >= 0.4.4",
    "mdx-gh-links >= 0.4",
    "pymdown-extensions >= 10.14.3",
    "mike >= 2.1.3",
    "mkdocstrings-shell >= 1.0.2",
    "mkdocs-mermaid2-plugin>=1.2.3",
]

[tool.ty.environment]
extra-paths = [
    "../ayon-core/client",
    "../ayon-maya/client",
    "../deadline-cloud-for-maya/plugin_env/scripts",
    "../ayon-core/.venv/Lib/site-packages",
    "../ayon-docker/backend",
    "../ayon-python-api",
    "client"
]
